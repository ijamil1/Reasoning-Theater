data:
  responses_dir: data/deepseek_r1_qwen_32b/mmlu/stage1_responses
  activations_dir: data/deepseek_r1_qwen_32b/mmlu/stage2_activations
  tokenizer_model: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
  dataset_name: mmlu

probe_base:
  num_layers: 64
  selected_layer: 63
  label_type: model_ans
  num_epochs: 50
  learning_rate: 0.005      # paper value for distilled DeepSeek-R1 models
  weight_decay: 0.001       # paper value
  normalize_acts: true      # paper value
  mlp_hidden_dim: 32
  recency_decay: 0.02
  disable_tqdm: true

probe_types:
  - attention
  - recency_linear
  - recency_mlp
  - attention_mlp

batch_sizes: [32, 64, 128]

results:
  results_dir: results
  seed: 42
  run_name_prefix: phase3
  summary_csv: results/phase3_summary.csv
