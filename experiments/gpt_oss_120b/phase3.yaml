data:
  responses_dir: data/gpt_oss_120b/mmlu/stage1_responses
  activations_dir: data/gpt_oss_120b/mmlu/stage2_activations
  tokenizer_model: openai/gpt-oss-120b
  dataset_name: mmlu

probe_base:
  num_layers: 36
  selected_layer: 35
  label_type: model_ans
  num_epochs: 50
  learning_rate: 0.005
  weight_decay: 0.001
  normalize_acts: true
  mlp_hidden_dim: 32
  recency_decay: 0.02
  disable_tqdm: true

probe_types:
  - attention
  - recency_linear
  - recency_mlp
  - attention_mlp

batch_sizes: [32, 64, 128]

results:
  results_dir: results
  seed: 42
  run_name_prefix: phase3_gpt_oss_120b
  summary_csv: results/phase3_gpt_oss_120b_summary.csv
